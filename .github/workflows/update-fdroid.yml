name: Update Plezy F-Droid repository

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      include_prereleases:
        description: "Include upstream prereleases"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fdroid-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute cache epoch
        id: cache-epoch
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Plezy artifacts
        uses: actions/cache@v4
        with:
          path: .cache/plezy
          key: plezy-cache-${{ runner.os }}-${{ steps.cache-epoch.outputs.week }}-${{ hashFiles('scripts/*.py', 'requirements.txt') }}
          restore-keys: |
            plezy-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build APK set (latest 3)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_INCLUDE_PRERELEASES: ${{ inputs.include_prereleases }}
        run: |
          ARGS=(--latest 3)
          if [[ "$INPUT_INCLUDE_PRERELEASES" == "true" ]]; then
            ARGS+=(--include-prereleases)
          fi
          python scripts/build_repo.py "${ARGS[@]}"

      - name: Restore F-Droid keystore
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
        run: |
          test -n "$FDROID_KEYSTORE_B64" || (echo "Missing FDROID_KEYSTORE_B64 secret" && exit 1)
          printf '%s' "$FDROID_KEYSTORE_B64" | base64 --decode > /tmp/fdroid-keystore.jks

      - name: Write F-Droid config
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
          FDROID_REPO_NAME: ${{ secrets.FDROID_REPO_NAME }}
        run: |
          test -n "$FDROID_KEYSTORE_PASSWORD" || (echo "Missing FDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$FDROID_KEY_ALIAS" || (echo "Missing FDROID_KEY_ALIAS secret" && exit 1)
          REPO_NAME="${FDROID_REPO_NAME:-Plezy F-Droid Mirror}" \
          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo" \
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import yaml

          def clean(value: str) -> str:
              return value.rstrip("\r\n")

          keystore_password = os.environ["FDROID_KEYSTORE_PASSWORD"]
          configured_key_password = os.environ.get("FDROID_KEY_PASSWORD", "")
          key_alias = clean(os.environ["FDROID_KEY_ALIAS"])
          repo_name = clean(os.environ["REPO_NAME"])

          if not keystore_password:
              raise ValueError("FDROID_KEYSTORE_PASSWORD resolves to empty")
          if not key_alias:
              raise ValueError("FDROID_KEY_ALIAS resolves to empty after newline trimming")
          if not repo_name:
              raise ValueError("FDROID_REPO_NAME resolves to empty after newline trimming")

          keystore_info = subprocess.run(
              [
                  "keytool",
                  "-list",
                  "-keystore",
                  "/tmp/fdroid-keystore.jks",
                  "-storepass",
                  keystore_password,
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout

          keystore_type = ""
          for line in keystore_info.splitlines():
              if line.startswith("Keystore type:"):
                  keystore_type = line.split(":", 1)[1].strip().upper()
                  break

          if keystore_type == "PKCS12":
              if configured_key_password and configured_key_password != keystore_password:
                  print(
                      "::warning::FDROID_KEY_PASSWORD differs from the PKCS12 key password. "
                      "Using FDROID_KEYSTORE_PASSWORD for keypass."
                  )
              key_password = keystore_password
          else:
              key_password = configured_key_password
              if not key_password:
                  raise ValueError("FDROID_KEY_PASSWORD is required for non-PKCS12 keystores")

          config = {
              "repo_name": repo_name,
              "repo_url": os.environ["REPO_URL"],
              "repo_description": "Mirror of Android Plezy releases from edde746/plezy",
              "archive_older": 0,
              "keystore": "/tmp/fdroid-keystore.jks",
              "keystorepass": keystore_password,
              "keypass": key_password,
              "repo_keyalias": key_alias,
              "make_current_version_link": False,
          }
          Path("fdroid/config.yml").write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY

      - name: Generate F-Droid index
        run: |
          cd fdroid
          fdroid update --create-metadata --pretty

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Write GitHub Pages landing files
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/write_pages.py --fdroid-dir fdroid --pages-base-url "$PAGES_BASE_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fdroid

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
